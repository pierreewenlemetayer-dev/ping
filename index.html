<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f9fc"><title>Ping — un jeu de pong</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#183153}button,select{font:inherit}#app{height:100dvh;width:100vw;display:flex;flex-direction:column;align-items:center;gap:clamp(3px,1vh,10px);padding:clamp(5px,1vh,12px);overflow:hidden}header{text-align:center;flex:none}h1{font:700 clamp(38px,7vh,76px) Fredoka,Arial,sans-serif;color:#2452a2;margin:0;line-height:1}header p{margin:2px 0 0;font-size:clamp(12px,1.8vh,17px)}#setup{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:8px;flex:none}label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:bold}select{padding:7px;border:1px solid #b5c4d6;border-radius:9px;background:white;color:#183153}button{border:0;border-radius:12px;background:#2452a2;color:white;font-weight:bold;padding:9px 17px;cursor:pointer;touch-action:none}button:active{filter:brightness(.85)}#hud{width:min(96vw,650px);display:flex;justify-content:space-between;font-weight:bold;align-items:center;flex:none}#clock{text-align:center;flex:1;font-weight:bold;font-variant-numeric:tabular-nums}#score,#lives{flex:1;white-space:nowrap}#lives{text-align:right;color:#e03145}#boardWrap{width:min(96vw,650px);flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}canvas{display:block;max-width:100%;max-height:100%;background:#101d34;border:3px solid #2452a2;border-radius:12px;touch-action:none}#controls{display:flex;justify-content:center;gap:10px;flex:none;width:min(96vw,650px)}#controls button{font-size:25px;flex:1;min-width:0;height:clamp(58px,9dvh,82px);padding:0;user-select:none;-webkit-user-select:none}#controls #start{font-size:clamp(16px,3dvh,21px);flex:0.7}#message{font-weight:bold;text-align:center;min-height:1.2em;font-size:13px;flex:none}@media(max-height:650px){#app{gap:3px;padding:3px}h1{font-size:clamp(30px,6vh,48px)}header p{font-size:11px}select{padding:4px}button{padding:5px 10px}#controls button{height:clamp(48px,9dvh,64px)}#message{font-size:11px}}@media(max-width:430px){#setup{gap:5px}label{font-size:11px}select{max-width:115px;padding:6px 2px}#setup>button{padding:8px}#controls button{width:auto}}
</style></head><body><main id="app"><header><h1>Ping</h1><p>un jeu de pong</p></header><section id="setup"><label>Mode<select id="mode"><option value="chill">Chill</option><option value="normal" selected>Normal</option><option value="speed">Speed Up</option></select></label><label>Durée<select id="duration"></select></label><label>Raquette<select id="paddleSize"></select></label></section><div id="hud"><span id="score">Score : 0</span><span id="clock"></span><span id="lives">❤️❤️❤️</span></div><div id="boardWrap"><canvas id="game" width="600" height="650" aria-label="Terrain de jeu Ping"></canvas></div><div id="controls"><button id="left" aria-label="Gauche">◀</button><button id="start">Start</button><button id="right" aria-label="Droite">▶</button></div><div id="message">Choisissez vos options, puis appuyez sur Start.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const W=600,H=650;let mode='normal',duration=0,size='medium',running=false,paused=false,waiting=false,score=0,lives=3,broken=0,remaining=0,last=0,raf=0,ball,paddle,bricks=[],keys={left:false,right:false},speed=310,seconds=0,dropElapsed=0,wallOffset=0,finished=false,endReason='';const rows=6,cols=10,brickW=51,brickH=19,gap=6,offsetX=16,offsetY=68;const colors=['#e56d80','#ed9b56','#edca61','#68c4ac','#62a8dd','#a88de1'];function options(){mode=$('mode').value;if(!running)$('lives').textContent=mode==='chill'?'':'❤️❤️❤️';const d=$('duration'),p=$('paddleSize'),oldD=d.value||'3',oldP=p.value||'medium';d.innerHTML='';for(let i=1;i<=5;i++)d.add(new Option(i+' min',String(i)));if(mode!=='chill')d.add(new Option('Sans limite','0'));d.value=mode==='chill'&&oldD==='0'?'3':oldD;p.innerHTML='';[['small','Petite'],['medium','Moyenne'],['large','Grande'],...(mode==='chill'?[['xl','Très grande']]:[])].forEach(([v,t])=>p.add(new Option(t,v)));p.value=mode!=='chill'&&oldP==='xl'?'large':oldP;}$('mode').addEventListener('change',options);options();function makeBricks(){bricks=[];remaining=rows*cols;wallOffset=0;dropElapsed=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:offsetX+c*(brickW+gap),y:offsetY+r*(brickH+gap),alive:true,color:colors[r]});}function resetBall(){ball={x:W/2,y:H-92,vx:(Math.random()<.5?-1:1)*speed*.55,vy:-speed*.835,r:8};const mag=Math.hypot(ball.vx,ball.vy);ball.vx*=speed/mag;ball.vy*=speed/mag;}function start(){cancelAnimationFrame(raf);finished=false;endReason='';mode=$('mode').value;duration=Number($('duration').value);size=$('paddleSize').value;speed=mode==='chill'?240:310;score=0;lives=3;broken=0;seconds=duration*60;paddle={x:W/2,y:H-46,w:({small:72,medium:105,large:145,xl:205})[size],h:15};makeBricks();resetBall();running=true;paused=false;waiting=false;setStartLabel();last=performance.now();$('message').textContent='';updateHud();raf=requestAnimationFrame(frame);}function setStartLabel(){$('start').textContent=!running||waiting?'Start':paused?'Start':'Pause';}function updateHud(){$('score').textContent='Score : '+score;$('lives').textContent=mode==='chill'?'':'❤️'.repeat(lives);const total=Math.ceil(Math.max(0,seconds));$('clock').textContent=duration?String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0'):'';}function finish(msg){running=false;waiting=false;paused=false;finished=true;endReason=msg.startsWith('Temps')?'Temps écoulé !':'Partie terminée !';setStartLabel();cancelAnimationFrame(raf);$('message').textContent='';draw();}function collideBrick(b){const nx=Math.max(b.x,Math.min(ball.x,b.x+brickW)),ny=Math.max(b.y,Math.min(ball.y,b.y+brickH));if((ball.x-nx)**2+(ball.y-ny)**2>ball.r**2)return false;const prevX=ball.x-ball.vx/60,prevY=ball.y-ball.vy/60;if(prevX<=b.x||prevX>=b.x+brickW)ball.vx=-ball.vx;else if(prevY<=b.y||prevY>=b.y+brickH)ball.vy=-ball.vy;else ball.vy=-ball.vy;return true;}function loseLife(wall){if(mode==='chill'){resetBall();return;}lives--;if(lives<=0){lives=0;updateHud();finish('Partie terminée ! Score : '+score);return;}if(wall)makeBricks();resetBall();waiting=true;setStartLabel();$('message').textContent=wall?'Le mur a atteint la raquette : appuyez sur Start.':'Balle perdue : appuyez sur Start.';}function step(dt){if(duration){seconds-=dt;if(seconds<=0){seconds=0;updateHud();finish('Temps écoulé ! Score : '+score);return;}}if(mode!=='chill'){dropElapsed+=dt;while(dropElapsed>=10){dropElapsed-=10;wallOffset+=brickH+gap;for(const b of bricks)b.y+=brickH+gap;if(bricks.some(b=>b.alive&&b.y+brickH>=paddle.y)){loseLife(true);updateHud();return;}}}const direction=Number(keys.right)-Number(keys.left);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x+direction*560*dt));const steps=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/5)),t=dt/steps;for(let s=0;s<steps;s++){ball.x+=ball.vx*t;ball.y+=ball.vy*t;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&Math.abs(ball.x-paddle.x)<=paddle.w/2+ball.r){ball.y=paddle.y-ball.r;const angle=(ball.x-paddle.x)/(paddle.w/2)*1.05;ball.vx=speed*Math.sin(angle);ball.vy=-speed*Math.cos(angle);}for(const b of bricks){if(b.alive&&collideBrick(b)){b.alive=false;remaining--;score+=10;broken++;if(mode==='speed'&&broken%3===0){speed=Math.min(speed*1.045,850);const m=Math.hypot(ball.vx,ball.vy);ball.vx*=speed/m;ball.vy*=speed/m;}if(remaining===0)makeBricks();break;}}if(ball.y>H+ball.r){loseLife(false);break;}}updateHud();}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101d34';ctx.fillRect(0,0,W,H);for(const b of bricks)if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,brickW,brickH);}if(paddle){ctx.fillStyle='#f3f6ff';ctx.fillRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h);}if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}if(finished){ctx.fillStyle='rgba(7,18,39,.86)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='700 47px Fredoka, Arial, sans-serif';ctx.fillText(endReason,W/2,H/2-24);ctx.fillStyle='#f6cf66';ctx.font='700 39px Fredoka, Arial, sans-serif';ctx.fillText('Score final : '+score,W/2,H/2+39);ctx.textAlign='start';}}function frame(now){const dt=Math.min((now-last)/1000,.035);last=now;if(running&&!paused&&!waiting)step(dt);draw();if(running)raf=requestAnimationFrame(frame);}function resize(){const wrap=$('boardWrap'),ratio=W/H;const w=Math.min(wrap.clientWidth,wrap.clientHeight*ratio),h=w/ratio;canvas.style.width=Math.max(1,w)+'px';canvas.style.height=Math.max(1,h)+'px';$('hud').style.width=Math.max(1,w)+'px';}new ResizeObserver(resize).observe($('boardWrap'));window.addEventListener('resize',resize);function setKey(k,v){keys[k]=v;}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')setKey('left',true);if(e.key==='ArrowRight')setKey('right',true);});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')setKey('left',false);if(e.key==='ArrowRight')setKey('right',false);});for(const k of ['left','right']){const el=$(k);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);setKey(k,true);});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>setKey(k,false));}window.addEventListener('blur',()=>{keys.left=keys.right=false;if(running&&!waiting){paused=true;setStartLabel();}});window.addEventListener('focus',()=>{last=performance.now();});$('start').addEventListener('click',()=>{if(!running){start();return;}if(waiting){waiting=false;paused=false;$('message').textContent='';}else{paused=!paused;$('message').textContent=paused?'Partie en pause':'';}setStartLabel();last=performance.now();});paddle={x:W/2,y:H-46,w:105,h:15};makeBricks();ball={x:W/2,y:H-92,r:8};draw();resize();})();
</script></body></html>
