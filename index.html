<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f9fc"><title>Ping — un jeu de pong</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#183153}button,select{font:inherit}#app{height:100dvh;width:100vw;display:flex;flex-direction:column;align-items:center;gap:clamp(3px,1vh,10px);padding:clamp(5px,1vh,12px);overflow:hidden}header{text-align:center;flex:none}h1{font:700 clamp(38px,7vh,76px) Fredoka,Arial,sans-serif;color:#2452a2;margin:0;line-height:1}header p{margin:2px 0 0;font-size:clamp(12px,1.8vh,17px)}#setup{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:8px;flex:none}label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:bold}select{padding:7px;border:1px solid #b5c4d6;border-radius:9px;background:white;color:#183153}button{border:0;border-radius:12px;background:#2452a2;color:white;font-weight:bold;padding:9px 17px;cursor:pointer;touch-action:none}button:active{filter:brightness(.85)}#hud{width:min(96vw,650px);display:flex;justify-content:space-between;font-weight:bold;align-items:center;flex:none}#clock{text-align:center;flex:1;font-weight:bold;font-variant-numeric:tabular-nums}#score,#lives{flex:1;white-space:nowrap}#lives{text-align:right;color:#e03145}#boardWrap{width:min(96vw,650px);flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}canvas{display:block;max-width:100%;max-height:100%;background:#101d34;border:3px solid #2452a2;border-radius:12px;touch-action:none}#controls{display:flex;justify-content:center;gap:10px;flex:none;width:min(96vw,650px)}#controls button{font-size:25px;flex:1;min-width:0;height:clamp(58px,9dvh,82px);padding:0;user-select:none;-webkit-user-select:none}#controls #start{font-size:clamp(16px,3dvh,21px);flex:0.7}#message{font-weight:bold;text-align:center;min-height:1.2em;font-size:13px;flex:none}@media(max-height:650px){#app{gap:3px;padding:3px}h1{font-size:clamp(30px,6vh,48px)}header p{font-size:11px}select{padding:4px}button{padding:5px 10px}#controls button{height:clamp(48px,9dvh,64px)}#message{font-size:11px}}@media(max-width:430px){#setup{gap:5px}label{font-size:11px}select{max-width:115px;padding:6px 2px}#setup>button{padding:8px}#controls button{width:auto}}
#boardWrap{position:relative}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}#overlay[hidden],.menu[hidden],#settings label[hidden]{display:none!important}.menu{pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(82%,320px);max-height:94%;overflow:auto;background:rgba(12,29,53,.94);padding:clamp(12px,2vh,22px);border:1px solid #8aa8d0;border-radius:17px;box-shadow:0 10px 35px #0008;color:white}.menu h2{font:700 25px Fredoka,Arial,sans-serif;text-align:center;margin:0}.menu label{font-size:13px;gap:4px}.menu select{width:100%;font-size:15px;padding:8px}.menu button{min-height:43px}.menu-actions{display:flex;gap:8px}.menu-actions button{flex:1}#welcome{width:min(65%,240px)}#welcome button{font:700 23px Fredoka,Arial,sans-serif;min-height:58px}@media(max-height:650px){.menu{gap:5px;padding:9px}.menu select{padding:4px;font-size:13px}.menu h2{font-size:20px}.menu button{min-height:34px}}</style><style id="home-title-style">h1 .home-title-link{color:inherit;font:inherit;letter-spacing:inherit;text-decoration:none;cursor:pointer}h1 .home-title-link:hover,h1 .home-title-link:visited,h1 .home-title-link:active{color:inherit;text-decoration:none}h1 .home-title-link:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}</style></head><body><main id="app"><header><h1><a class="home-title-link" href="./" aria-label="Revenir à l’accueil">Ping</a></h1><p>un jeu de pong</p></header><div id="hud"><span id="score">Score : 0</span><span id="clock"></span><span id="lives">❤️❤️❤️</span></div><div id="boardWrap"><canvas id="game" width="600" height="650" aria-label="Terrain de jeu Ping"></canvas><div id="overlay"><div id="welcome" class="menu"><button id="playHome">Play</button><button id="openSettings">Settings</button></div><div id="settings" class="menu" hidden><h2>Settings</h2><label>Mode<select id="mode"><option value="chill">Chill</option><option value="normal" selected>Normal</option><option value="speed">Speed Up</option></select></label><label id="paddleLabel" hidden>Raquette<select id="paddleSize"><option value="small">Petite</option><option value="medium" selected>Moyenne</option><option value="large">Grande</option></select></label><label id="speedLabel" hidden>Speed<select id="speedChoice"><option value="slow">Lent</option><option value="normal" selected>Normale</option><option value="fast">Rapide</option><option value="veryfast">Très rapide</option></select></label><label id="bonusLabel" hidden>Bonus<select id="bonusChoice"><option value="normal" selected>Non</option><option value="bonus">Oui</option></select></label><label id="durationLabel" hidden>Durée<select id="duration"><option value="1">1 min</option><option value="2">2 min</option><option value="3" selected>3 min</option><option value="4">4 min</option><option value="5">5 min</option><option value="0">Sans limite</option></select></label><div class="menu-actions"><button id="backSettings">Retour</button><button id="playSettings">Play</button></div></div></div></div><div id="controls"><button id="left" aria-label="Gauche">◀</button><button id="start">Start</button><button id="right" aria-label="Droite">▶</button></div><div id="message">Choisissez vos options, puis appuyez sur Start.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const W=600,H=650;let mode='normal',duration=0,size='medium',running=false,paused=false,waiting=false,score=0,lives=3,broken=0,remaining=0,last=0,raf=0,ball,balls=[],paddle,bricks=[],keys={left:false,right:false},speed=310,seconds=0,dropElapsed=0,wallOffset=0,finished=false,endReason='',powerTime=0,paddleTime=0,paddleEffect='',gameTime=0;const rows=6,cols=10,brickW=51,brickH=19,gap=6,offsetX=16,offsetY=68;let bonusEnabled=false;const colors=['#e56d80','#ed9b56','#edca61','#68c4ac','#62a8dd','#a88de1'];function showWelcome(){$('welcome').hidden=false;$('settings').hidden=true;$('overlay').hidden=false;}
function showSettings(){$('welcome').hidden=true;$('settings').hidden=false;$('overlay').hidden=false;refreshSettings();}
function refreshSettings(){const chill=$('mode').value==='chill';$('paddleLabel').hidden=chill;$('speedLabel').hidden=false;$('bonusLabel').hidden=false;$('durationLabel').hidden=false;$('duration').querySelector('option[value="0"]').hidden=chill;if(chill&&$('duration').value==='0')$('duration').value='3';}
$('mode').addEventListener('change',refreshSettings);
$('openSettings').addEventListener('click',showSettings);$('backSettings').addEventListener('click',showWelcome);
$('playHome').addEventListener('click',()=>{mode='normal';bonusEnabled=false;size='medium';duration=3;speed=310*1.2;start(true);});
$('playSettings').addEventListener('click',()=>start(false));
function makeBricks(){
bricks=[];remaining=rows*cols;wallOffset=0;dropElapsed=0;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:offsetX+c*(brickW+gap),y:offsetY+r*(brickH+gap),alive:true,color:colors[r],power:null});
if(bonusEnabled){
const ids=bricks.map((_,i)=>i);
for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
(mode==='chill'?['multi','multi','rainbow','rainbow']:['multi','rainbow','grow','shrink']).forEach((type,k)=>{for(let j=0;j<4;j++)bricks[ids[k*4+j]].power=type;});
}}
function resetBall(){ball={x:W/2,y:H-92,vx:(Math.random()<.5?-1:1)*speed*.55,vy:-speed*.835,r:8};const mag=Math.hypot(ball.vx,ball.vy);ball.vx*=speed/mag;ball.vy*=speed/mag;balls=[ball];}
function start(defaults=false){cancelAnimationFrame(raf);finished=false;endReason='';if(!defaults){mode=$('mode').value;duration=Number($('duration').value);size=mode==='chill'?'xl':$('paddleSize').value;bonusEnabled=$('bonusChoice').value==='bonus';const factor=({slow:1,normal:1.2,fast:1.4,veryfast:1.6})[$('speedChoice').value];speed=(mode==='chill'?240:310)*factor;}$('overlay').hidden=true;score=0;lives=3;broken=0;seconds=duration*60;gameTime=0;powerTime=0;paddleTime=0;paddleEffect='';paddle={x:W/2,y:H-46,w:({small:72,medium:105,large:145,xl:205})[size],h:15};makeBricks();resetBall();running=true;paused=false;waiting=false;setStartLabel();last=performance.now();$('message').textContent='';updateHud();raf=requestAnimationFrame(frame);}
function setStartLabel(){$('start').textContent=!running||waiting?'Start':paused?'Start':'Pause';}
function updateHud(){$('score').textContent='Score : '+score;$('lives').textContent=mode==='chill'?'':'❤️'.repeat(lives);const total=Math.ceil(Math.max(0,seconds));$('clock').textContent=duration?String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0'):'';}
function finish(msg){running=false;waiting=false;paused=false;finished=true;endReason=msg.startsWith('Temps')?'Temps écoulé !':'Partie terminée !';setStartLabel();cancelAnimationFrame(raf);$('message').textContent='';draw();}
function collideBrick(b,orb){const nx=Math.max(b.x,Math.min(orb.x,b.x+brickW)),ny=Math.max(b.y,Math.min(orb.y,b.y+brickH));if((orb.x-nx)**2+(orb.y-ny)**2>orb.r**2)return false;
if(powerTime<=0){const prevX=orb.x-orb.vx/60,prevY=orb.y-orb.vy/60;if(prevX<=b.x||prevX>=b.x+brickW)orb.vx=-orb.vx;else if(prevY<=b.y||prevY>=b.y+brickH)orb.vy=-orb.vy;else orb.vy=-orb.vy;}return true;}
function triggerPower(type,orb){if(type==='multi'){const angle=.32;const vx=orb.vx,vy=orb.vy;const c=Math.cos(angle),sn=Math.sin(angle);const clone={x:orb.x,y:orb.y,vx:vx*c-vy*sn,vy:vx*sn+vy*c,r:orb.r};balls.push(clone);ball=balls[0];}
else if(type==='rainbow'){powerTime=5;}
else if(type==='grow'||type==='shrink'){paddleEffect=type;paddleTime=5;paddle.w=type==='grow'?205:36;paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));}}
function loseLife(wall){if(mode==='chill'){resetBall();return;}lives--;if(lives<=0){lives=0;updateHud();finish('Partie terminée ! Score : '+score);return;}if(wall)makeBricks();powerTime=0;paddleTime=0;paddleEffect='';paddle.w=({small:72,medium:105,large:145,xl:205})[size];resetBall();waiting=true;setStartLabel();$('message').textContent=wall?'Le mur a atteint la raquette : appuyez sur Start.':'Balle perdue : appuyez sur Start.';}
function step(dt){
gameTime+=dt;if(powerTime>0)powerTime=Math.max(0,powerTime-dt);if(paddleTime>0){paddleTime=Math.max(0,paddleTime-dt);if(paddleTime===0){paddleEffect='';paddle.w=({small:72,medium:105,large:145,xl:205})[size];}}
if(duration){seconds-=dt;if(seconds<=0){seconds=0;updateHud();finish('Temps écoulé ! Score : '+score);return;}}
if(mode!=='chill'){dropElapsed+=dt;while(dropElapsed>=10){dropElapsed-=10;wallOffset+=brickH+gap;for(const b of bricks)b.y+=brickH+gap;if(bricks.some(b=>b.alive&&b.y+brickH>=paddle.y)){loseLife(true);updateHud();return;}}}
const direction=Number(keys.right)-Number(keys.left);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x+direction*560*dt));
const active=balls.slice();const lost=[];
for(const orb of active){if(!balls.includes(orb))continue;
const steps=Math.max(1,Math.ceil(Math.hypot(orb.vx,orb.vy)*dt/5)),t=dt/steps;
for(let s=0;s<steps;s++){
orb.x+=orb.vx*t;orb.y+=orb.vy*t;
if(orb.x<orb.r){orb.x=orb.r;orb.vx=Math.abs(orb.vx);}if(orb.x>W-orb.r){orb.x=W-orb.r;orb.vx=-Math.abs(orb.vx);}
if(orb.y<orb.r){orb.y=orb.r;orb.vy=Math.abs(orb.vy);}
if(orb.vy>0&&orb.y+orb.r>=paddle.y&&orb.y-orb.r<=paddle.y+paddle.h&&Math.abs(orb.x-paddle.x)<=paddle.w/2+orb.r){orb.y=paddle.y-orb.r;const angle=(orb.x-paddle.x)/(paddle.w/2)*1.05;const magnitude=Math.hypot(orb.vx,orb.vy);orb.vx=magnitude*Math.sin(angle);orb.vy=-magnitude*Math.cos(angle);}
for(const b of bricks){if(b.alive&&collideBrick(b,orb)){b.alive=false;remaining--;score+=10;broken++;if(mode==='speed'&&broken%3===0){speed=Math.min(speed*1.045,850);for(const moving of balls){const m=Math.hypot(moving.vx,moving.vy);moving.vx*=speed/m;moving.vy*=speed/m;}}
if(b.power)triggerPower(b.power,orb);
if(remaining===0)makeBricks();
if(powerTime<=0)break;
}}
if(orb.y>H+orb.r){lost.push(orb);break;}
}}
if(lost.length){balls=balls.filter(b=>!lost.includes(b));ball=balls[0];if(balls.length===0){loseLife(false);updateHud();return;}}
updateHud();}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101d34';ctx.fillRect(0,0,W,H);
for(const b of bricks)if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,brickW,brickH);if(b.power){const stripes=b.power==='rainbow'?['#e56d80','#ed9b56','#edca61','#68c4ac','#62a8dd','#a88de1']:b.power==='multi'?['#e56d80','#ffffff']:b.power==='grow'?['#68c4ac','#ffffff']:['#ed9b56','#ffffff'];ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,brickW,brickH);ctx.clip();const stripe=8;for(let i=-brickH;i<brickW+brickH;i+=stripe){ctx.fillStyle=stripes[Math.floor((i+brickH)/stripe)%stripes.length];ctx.beginPath();ctx.moveTo(b.x+i,b.y);ctx.lineTo(b.x+i+stripe,b.y);ctx.lineTo(b.x+i+stripe+brickH,b.y+brickH);ctx.lineTo(b.x+i+brickH,b.y+brickH);ctx.closePath();ctx.fill();}ctx.restore();}}
ctx.textBaseline='alphabetic';ctx.textAlign='start';
if(paddle){ctx.fillStyle='#f3f6ff';ctx.fillRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h);}
for(const orb of balls){ctx.beginPath();ctx.arc(orb.x,orb.y,orb.r,0,Math.PI*2);ctx.fillStyle=powerTime>0?'hsl('+((gameTime*600)%360)+' 100% 65%)':'#fff';ctx.fill();}
if(finished){ctx.fillStyle='rgba(7,18,39,.86)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='700 47px Fredoka, Arial, sans-serif';ctx.fillText(endReason,W/2,H/2-24);ctx.fillStyle='#f6cf66';ctx.font='700 39px Fredoka, Arial, sans-serif';ctx.fillText('Score final : '+score,W/2,H/2+39);ctx.textAlign='start';}}
function frame(now){const dt=Math.min((now-last)/1000,.035);last=now;if(running&&!paused&&!waiting)step(dt);draw();if(running)raf=requestAnimationFrame(frame);}
function resize(){const wrap=$('boardWrap'),ratio=W/H;const w=Math.min(wrap.clientWidth,wrap.clientHeight*ratio),h=w/ratio;canvas.style.width=Math.max(1,w)+'px';canvas.style.height=Math.max(1,h)+'px';$('hud').style.width=Math.max(1,w)+'px';}new ResizeObserver(resize).observe($('boardWrap'));window.addEventListener('resize',resize);function setKey(k,v){keys[k]=v;}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')setKey('left',true);if(e.key==='ArrowRight')setKey('right',true);});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')setKey('left',false);if(e.key==='ArrowRight')setKey('right',false);});for(const k of ['left','right']){const el=$(k);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);setKey(k,true);});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>setKey(k,false));}window.addEventListener('blur',()=>{keys.left=keys.right=false;if(running&&!waiting){paused=true;setStartLabel();}});window.addEventListener('focus',()=>{last=performance.now();});$('start').addEventListener('click',()=>{if(!running){showWelcome();return;}if(waiting){waiting=false;paused=false;$('message').textContent='';}else{paused=!paused;$('message').textContent=paused?'Partie en pause':'';}setStartLabel();last=performance.now();});window.__homeActivityActive=()=>running&&!finished; paddle={x:W/2,y:H-46,w:105,h:15};makeBricks();ball={x:W/2,y:H-92,r:8};balls=[ball];draw();resize();showWelcome();})();
</script><script id="home-title-script">(function(){const link=document.querySelector('h1 .home-title-link');if(!link)return;function active(){if(typeof window.__homeActivityActive==='function')return window.__homeActivityActive();return [...document.querySelectorAll('textarea')].some(x=>x.value.trim());}link.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.stopImmediatePropagation();if(e.key===' '){e.preventDefault();link.click()}}},true);link.addEventListener('click',e=>{if(active()&&!confirm('Une activité est en cours. Revenir à l’accueil et abandonner la progression ?'))e.preventDefault()});})();</script></body></html>
